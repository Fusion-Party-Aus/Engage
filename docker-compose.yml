services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    entrypoint: ["bash", "/usr/local/bin/engage-mongo-start.sh"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set MONGO_INITDB_ROOT_USERNAME in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set MONGO_INITDB_ROOT_PASSWORD in .env}
      MONGO_INITDB_DATABASE: ${MONGODB_DB_NAME:-fusion_horizon_policy_preview}
      MONGO_APP_USER: ${MONGO_APP_USER:-fusion_app}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}
    volumes:
      - mongo_data:/data/db
      - ./docker/mongo-start.sh:/usr/local/bin/engage-mongo-start.sh:ro
      - ./docker/mongo-healthcheck.js:/usr/local/bin/engage-mongo-healthcheck.js:ro
      - ./docker/mongo-init.js:/docker-entrypoint-initdb.d/10-create-app-user.js:ro
    ports:
      - "${MONGO_BIND_ADDRESS:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "/usr/local/bin/engage-mongo-healthcheck.js"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt:
      - no-new-privileges:true

  app:
    image: fusion-engage:${APP_IMAGE_TAG:-local}
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      APP_MODE: ${APP_MODE:-preview}
      FORMAL_BALLOTS_ENABLED: ${FORMAL_BALLOTS_ENABLED:-false}
      MONGODB_DB_NAME: ${MONGODB_DB_NAME:-fusion_horizon_policy_preview}
      MONGODB_URI: mongodb://${MONGO_APP_USER:-fusion_app}:${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD in .env}@mongo:27017/${MONGODB_DB_NAME:-fusion_horizon_policy_preview}?authSource=${MONGODB_DB_NAME:-fusion_horizon_policy_preview}&replicaSet=engage&directConnection=true
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      PREVIEW_ADMIN_ID: preview-admin-01
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-4321}:4321"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4321/api/ballots').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  mongo_data:
