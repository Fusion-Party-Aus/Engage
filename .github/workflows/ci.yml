name: Application checks
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**", "codex/**"]
permissions:
  contents: read
jobs:
  check:
    # Temporary MongoDB 8.0 workaround for the runner's Ubuntu kernel-version
    # detection bug: actions/runner-images#15005 / MongoDB SERVER-131779.
    # Return to ubuntu-latest after a published 8.0 fix is verified on that kernel.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      VOTING_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
      AUTH_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pnpm install --frozen-lockfile
      - name: Start isolated MongoDB replica set
        run: |
          docker run -d --name engage-ci-mongo -p 127.0.0.1:27017:27017 mongo:8.0 --replSet engage-ci --bind_ip_all
          node --input-type=module <<'JS'
          import { MongoClient } from 'mongodb';
          const client = new MongoClient(process.env.VOTING_TEST_MONGODB_URI, { serverSelectionTimeoutMS: 1000 });
          try {
            let ready = false;
            for (let attempt = 0; attempt < 60; attempt++) {
              try {
                await client.connect();
                const admin = client.db('admin');
                const hello = await admin.command({ hello: 1 });
                if (!hello.setName) await admin.command({ replSetInitiate: { _id: 'engage-ci', members: [{ _id: 0, host: 'localhost:27017' }] } });
                if (hello.setName && hello.isWritablePrimary) { ready = true; break; }
              } catch (error) { if (attempt === 59) throw error; }
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            if (!ready) throw new Error('MongoDB replica set never became writable');
          } finally { await client.close(); }
          JS
      - run: pnpm check
      - name: Documentation link check
        run: pnpm docs:check-links
      - name: Confirm isolated MongoDB test configuration
        run: |
          test -n "${VOTING_TEST_MONGODB_URI:-}"
          test -n "${AUTH_TEST_MONGODB_URI:-}"
      - name: Node and real MongoDB voting/authentication regressions
        run: pnpm test
      - run: pnpm build
      - name: Desktop and mobile member lifecycle verification
        env:
          ENGAGE_PLAYWRIGHT_MODULE: ${{ runner.temp }}/engage-browser/node_modules/playwright/index.mjs
        run: |
          npm install --prefix "$RUNNER_TEMP/engage-browser" --no-save --no-package-lock playwright@1.57.0
          node "$RUNNER_TEMP/engage-browser/node_modules/playwright/cli.js" install --with-deps chromium
          node scripts/member-lifecycle-browser.mjs
      - name: Save synthetic lifecycle screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member-lifecycle-screenshots
          path: docs/screenshots/member-lifecycle/
          if-no-files-found: ignore
      - name: MongoDB logs on failure
        if: failure()
        run: docker logs engage-ci-mongo
