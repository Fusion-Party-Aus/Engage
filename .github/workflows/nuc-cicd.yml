name: NUC Build & Deploy Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_nuc:
        description: 'Deploy to NUC after build'
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: nuc-deploy-main
  cancel-in-progress: false

jobs:
  validate:
    name: Application Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOVERNANCE_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
      AUTH_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/?directConnection=true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pnpm install --frozen-lockfile
      - name: Start isolated MongoDB replica set
        run: |
          docker run -d --name engage-ci-mongo -p 127.0.0.1:27017:27017 mongo:8.0 --replSet engage-ci --bind_ip_all
          node --input-type=module <<'JS'
          import { MongoClient } from 'mongodb';
          const client = new MongoClient(process.env.GOVERNANCE_TEST_MONGODB_URI, { serverSelectionTimeoutMS: 1000 });
          try {
            let ready = false;
            for (let attempt = 0; attempt < 60; attempt++) {
              try {
                await client.connect();
                const admin = client.db('admin');
                const hello = await admin.command({ hello: 1 });
                if (!hello.setName) await admin.command({ replSetInitiate: { _id: 'engage-ci', members: [{ _id: 0, host: 'localhost:27017' }] } });
                if (hello.setName && hello.isWritablePrimary) { ready = true; break; }
              } catch (error) { if (attempt === 59) throw error; }
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            if (!ready) throw new Error('MongoDB replica set never became writable');
          } finally { await client.close(); }
          JS
      - name: Astro typecheck & diagnostics
        run: pnpm check
      - name: Node & MongoDB governance checks
        run: pnpm test
      - name: Real MongoDB vote cutoff regressions
        run: pnpm test:cutoff
      - name: Server build verification
        run: pnpm build
      - name: Controlled Google authentication, membership and rendered privacy checks
        env:
          AUTH_TEST_SSR: "true"
        run: pnpm test:auth

  build-and-publish:
    name: Build & Publish NUC Image (linux/amd64)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image for NUC
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-nuc:
    name: Deploy to Production NUC
    needs: build-and-publish
    if: github.event_name == 'push' || github.event.inputs.deploy_to_nuc != 'false'
    runs-on: [self-hosted, nuc]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy release on NUC
        run: |
          chmod +x scripts/deploy-nuc.sh
          ./scripts/deploy-nuc.sh ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
